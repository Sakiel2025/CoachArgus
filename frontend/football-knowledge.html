<!-- Three.js：主 CDN（BootCDN，国内稳定）→ 失败时自动切换 unpkg 备用 -->
<script>
(function(){
  function loadScript(src, onOk, onErr){
    var s = document.createElement('script');
    s.src = src;
    s.onload = onOk;
    s.onerror = onErr;
    document.head.appendChild(s);
  }
  var primary   = 'https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js';
  var fallback1 = 'https://unpkg.com/three@0.128.0/build/three.min.js';
  var fallback2 = 'https://cdn.staticfile.org/three.js/r128/three.min.js';
  loadScript(primary,
    function(){ console.log('[Three.js] Loaded from BootCDN'); },
    function(){
      console.warn('[Three.js] BootCDN failed, trying unpkg...');
      loadScript(fallback1,
        function(){ console.log('[Three.js] Loaded from unpkg'); },
        function(){
          console.warn('[Three.js] unpkg failed, trying staticfile...');
          loadScript(fallback2,
            function(){ console.log('[Three.js] Loaded from staticfile'); },
            function(){ console.error('[Three.js] All CDN sources failed'); }
          );
        }
      );
    }
  );
})();
</script>
<style>
:root{
  --bg:#060d1a;--card:rgba(12,24,48,0.92);--primary:#00ff88;--accent:#00d4ff;
  --warn:#ffce56;--red:#ff6384;--orange:#ff7828;--purple:#a78bfa;
  --border:rgba(0,255,136,0.15);--text:rgba(255,255,255,0.88);--dim:rgba(255,255,255,0.42)
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden;display:flex;flex-direction:column}
#bg-canvas{position:fixed;inset:0;pointer-events:none;z-index:0}

/* ── Header ── */
.header{position:sticky;top:0;z-index:50;background:rgba(6,13,26,0.97);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);padding:11px 20px;display:flex;align-items:center;gap:12px}
.header-icon{width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,rgba(0,255,136,0.18),rgba(0,212,255,0.12));
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;color:var(--primary);flex-shrink:0}
.header-title{flex:1}
.header-title h1{font-size:1rem;font-weight:700;color:#fff}
.header-title p{font-size:0.7rem;color:var(--dim);margin-top:1px}
.search-wrap{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.11);border-radius:22px;padding:6px 14px;width:220px;transition:border-color .2s}
.search-wrap:focus-within{border-color:var(--primary)}
.search-wrap input{background:none;border:none;outline:none;color:var(--text);font-size:0.84rem;flex:1}
.search-wrap input::placeholder{color:var(--dim)}
.search-wrap i{color:var(--dim);font-size:0.8rem}

/* ── Cat bar ── */
.cat-bar{position:sticky;top:60px;z-index:40;background:rgba(6,13,26,0.93);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.05);padding:8px 20px;display:flex;gap:6px;
  overflow-x:auto;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-btn{padding:5px 14px;border-radius:20px;cursor:pointer;font-size:0.78rem;font-weight:600;
  white-space:nowrap;border:1px solid transparent;transition:all .2s;
  background:rgba(255,255,255,0.05);color:var(--dim)}
.cat-btn:hover{color:#fff;background:rgba(255,255,255,0.1)}
.cat-btn.active{color:#060d1a;background:var(--primary);border-color:var(--primary)}

/* ── Main layout ── 单一滚动容器，避免与 iframe 双滚动条 */
.main{position:relative;z-index:1;padding:18px 20px;max-width:1440px;margin:0 auto;
  flex:1;overflow-y:auto;overflow-x:hidden;}

/* ── Graph section ── */
.graph-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:16px;margin-bottom:22px;position:relative;overflow:hidden;box-sizing:border-box;}
.graph-wrap.graph-hidden{display:none!important;}
.graph-wrap::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 25% 50%,rgba(0,255,136,0.05) 0%,transparent 55%),
             radial-gradient(ellipse at 75% 30%,rgba(0,212,255,0.05) 0%,transparent 50%);
  pointer-events:none}
.graph-title{font-size:0.83rem;font-weight:700;color:var(--primary);
  margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.graph-title span{font-size:.68rem;color:var(--dim);font-weight:400}
#graph-canvas{width:100%;display:block;border-radius:10px;
  background:rgba(0,0,0,0.28);cursor:grab;}
#graph-canvas:active{cursor:grabbing}
.graph-hint{font-size:0.68rem;color:var(--dim);margin-top:6px;text-align:center;}

/* ── Cards ── */
.section-hd{font-size:0.9rem;font-weight:700;color:#fff;margin-bottom:14px;
  display:flex;align-items:center;gap:8px}
.section-hd .badge{font-size:0.68rem;padding:2px 9px;border-radius:10px;
  background:rgba(0,255,136,0.14);color:var(--primary);font-weight:600}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:26px}
.kcard{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:13px;
  padding:15px 17px;cursor:pointer;transition:all .22s;position:relative;overflow:hidden}
.kcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--kc,var(--primary));border-radius:3px 3px 0 0;opacity:0;transition:opacity .2s}
.kcard::after{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,var(--kc-glow,rgba(0,255,136,0.06)) 0%,transparent 65%);
  opacity:0;transition:opacity .3s;pointer-events:none}
.kcard:hover{transform:translateY(-3px);border-color:rgba(0,255,136,0.2);
  box-shadow:0 8px 30px rgba(0,0,0,0.4),0 0 0 1px var(--kc,rgba(0,255,136,0.12))}
.kcard:hover::before,.kcard:hover::after{opacity:1}
.kcard-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.kcard-ico{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:0.92rem;flex-shrink:0}
.kcard-name{font-size:0.92rem;font-weight:700;color:#fff;line-height:1.3}
.kcard-en{font-size:0.68rem;color:var(--dim);margin-top:2px;font-style:italic}
.kcard-desc{font-size:0.8rem;color:rgba(255,255,255,0.58);line-height:1.7}
.kcard-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:0.66rem;padding:2px 8px;border-radius:10px;border:1px solid;font-weight:500}
.empty-tip{text-align:center;padding:60px 20px;color:var(--dim);font-size:0.86rem}
.empty-tip i{font-size:1.8rem;display:block;margin-bottom:12px;opacity:.4}

/* ── 3D Anim Demo ── */
.anim3d-wrap{width:100%;height:320px;border-radius:12px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#071428 0%,#0a1f10 100%);
  border:1px solid rgba(0,255,136,0.18);margin-bottom:16px}
.anim3d-wrap canvas{width:100%!important;height:100%!important;display:block}
.anim3d-label{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  font-size:0.68rem;color:rgba(255,255,255,0.45);white-space:nowrap;pointer-events:none;
  background:rgba(0,0,0,0.4);padding:2px 10px;border-radius:8px}
.anim3d-badge{position:absolute;top:8px;right:10px;font-size:0.62rem;
  background:rgba(0,255,136,0.12);color:var(--primary);border:1px solid rgba(0,255,136,0.2);
  padding:2px 8px;border-radius:8px;pointer-events:none}
.anim3d-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,0.3);font-size:0.8rem;gap:8px}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .22s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{background:rgba(7,16,36,0.99);border:1px solid var(--border);border-radius:18px;
  padding:28px 32px;max-width:680px;width:95%;max-height:88vh;overflow-y:auto;
  position:relative;transform:translateY(16px) scale(.97);transition:transform .24s;
  scrollbar-width:thin;scrollbar-color:rgba(0,255,136,0.2) transparent}
.modal-overlay.open .modal-box{transform:none}
.modal-close{position:absolute;top:14px;right:16px;background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.5);font-size:.95rem;
  width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .18s}
.modal-close:hover{background:rgba(255,70,70,0.2);color:#fff}
.modal-ico{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:1.4rem;margin-bottom:14px}
.modal-title{font-size:1.3rem;font-weight:800;color:#fff;margin-bottom:2px}
.modal-en{font-size:0.78rem;color:var(--dim);font-style:italic;margin-bottom:13px}
.msec{margin-bottom:14px}
.msec-title{font-size:0.72rem;font-weight:700;color:var(--primary);letter-spacing:1px;
  margin-bottom:6px;display:flex;align-items:center;gap:6px}
.msec-text{font-size:0.85rem;color:rgba(255,255,255,0.7);line-height:1.85}
.mlist{padding-left:15px}
.mlist li{font-size:0.83rem;color:rgba(255,255,255,0.66);line-height:1.95}
.related-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}
.rchip{padding:5px 13px;border-radius:20px;font-size:0.76rem;font-weight:600;
  background:rgba(0,255,136,0.08);color:var(--primary);border:1px solid rgba(0,255,136,0.2);
  cursor:pointer;transition:all .17s}
.rchip:hover{background:rgba(0,255,136,0.2)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,255,136,0.2);border-radius:4px}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div class="header">
  <div class="header-icon"><i class="fas fa-project-diagram"></i></div>

</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box" id="modal-box">
    <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    <div id="modal-content"></div>
  </div>
</div>

(function(){
  const c = document.getElementById('bg-canvas'), ctx = c.getContext('2d');
  let W, H, pts = [];
  function resize(){ W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  for(let i = 0; i < 60; i++){
    pts.push({
      x: Math.random()*1920, y: Math.random()*1080,
      r: Math.random()*1.5+0.3,
      vx: (Math.random()-.5)*.18, vy: (Math.random()-.5)*.18,
      a: Math.random()*.25+.06,
      hue: Math.random() < .6 ? 136 : (Math.random() < .5 ? 190 : 50)
    });
  }
  (function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = p.hue===136 ? `rgba(0,255,136,${p.a})`
                    : p.hue===190 ? `rgba(0,212,255,${p.a})`
                    : `rgba(255,206,86,${p.a*0.6})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  })();
})();

(function(){

  const ctx = canvas.getContext('2d');
  const graphWrap = document.getElementById('graph-wrap');

  // ── 动态设置图谱高度：填满页面剩余可视区域 ──
  function resizeGraphWrap() {
    const header = document.querySelector('.header');
    const catBar = document.querySelector('.cat-bar');
    const headerH = header ? header.offsetHeight : 60;
    const catH    = catBar  ? catBar.offsetHeight  : 44;
    const titleEl = graphWrap.querySelector('.graph-title');
    const hintEl  = graphWrap.querySelector('.graph-hint');
    const titleH  = titleEl ? titleEl.offsetHeight + 10 : 44;
    const hintH   = hintEl  ? hintEl.offsetHeight  + 6  : 28;
    const mainPad = 18 * 2;
    const wrapPad = 16 * 2;
    const wrapMgn = 22;
    const canvasH = Math.max(340, window.innerHeight - headerH - catH - mainPad - wrapPad - titleH - hintH - wrapMgn - 8);
    // 设置 canvas 的 CSS height，让浏览器重新布局后 offsetHeight 会更新
    canvas.style.height = canvasH + 'px';
  }
  resizeGraphWrap();
  window.addEventListener('resize', () => { resizeGraphWrap(); requestAnimationFrame(layout); });

  // 节点定义（含聚类分组）
  const NODES = [
    // 防守组 (左区)
    {id:'gk',    label:'门将',      color:'#ffce56', cluster:0},
    {id:'cb',    label:'中后卫',    color:'#ff6384', cluster:0},
    {id:'lb',    label:'边后卫',    color:'#00d4ff', cluster:0},
    {id:'dm',    label:'后腰',      color:'#00ff88', cluster:0},
    {id:'offside-trap',label:'越位陷阱',color:'#ff6384',cluster:0},
    // 中场组 (中区)
    {id:'cm',    label:'中场核心',  color:'#ffce56', cluster:1},
    {id:'am',    label:'前腰',      color:'#a78bfa', cluster:1},
    {id:'pressing', label:'高压迫',   color:'#ff6384', cluster:1},
    {id:'tiki-taka',label:'Tiki-Taka',color:'#00d4ff',cluster:1},
    {id:'formation-433',label:'4-3-3',color:'#00ff88',cluster:1},
    // 进攻组 (右区)
    {id:'winger',label:'边锋',      color:'#ff7828', cluster:2},
    {id:'cf',    label:'中锋',      color:'#00ff88', cluster:2},
    {id:'false9',label:'假9号',     color:'#00d4ff', cluster:2},
    {id:'counter-attack',label:'快反击',color:'#ffce56',cluster:2},
    {id:'formation-442',label:'4-4-2',color:'#ff7828',cluster:2},
    // 规则/数据组 (下区)
    {id:'offside',label:'越位规则', color:'#ff6384', cluster:3},
    {id:'var',   label:'VAR',       color:'#00d4ff', cluster:3},
    {id:'penalty',label:'点球',     color:'#ff7828', cluster:3},
    {id:'xg',    label:'xG',        color:'#00ff88', cluster:3},
    {id:'possession',label:'控球率',color:'#00d4ff', cluster:3},
    {id:'cl',    label:'欧冠',      color:'#ffce56', cluster:3},
  ];

  const EDGES = [
    ['gk','cb'],['cb','lb'],['lb','dm'],['dm','cm'],['cm','am'],['am','cf'],['cf','false9'],
    ['am','winger'],['winger','cf'],['pressing','dm'],['pressing','cm'],
    ['tiki-taka','cm'],['tiki-taka','am'],['tiki-taka','false9'],
    ['counter-attack','winger'],['counter-attack','cf'],
    ['xg','cf'],['xg','am'],['offside','cb'],['offside','var'],
    ['var','cl'],['false9','am'],['dm','cb'],['lb','winger'],
    ['formation-433','pressing'],['formation-442','counter-attack'],
    ['offside-trap','cb'],['offside-trap','offside'],
    ['possession','tiki-taka'],['possession','pressing'],
    ['penalty','gk'],['penalty','var'],
  ];

  // 聚类中心（相对比例，运行时乘以画布尺寸）
  const CLUSTER_POS = [
    {rx:0.18, ry:0.38},  // 0 防守（左上）
    {rx:0.50, ry:0.26},  // 1 中场（中上）
    {rx:0.82, ry:0.38},  // 2 进攻（右上）
    {rx:0.50, ry:0.74},  // 3 规则/数据（中下）
  ];

  let W = 0, H = 0;
  let dragging = null, dragMoved = false, hovered = null;
  let scale = 1, ox = 0, oy = 0;
  let panning = false, lmx = 0, lmy = 0, panMoved = false;
  let tick = 0;
  let initialized = false;

  // 节点飘动偏移（每个节点独立相位）
  NODES.forEach((n, i) => {
    n.floatPhase  = Math.random() * Math.PI * 2;
    n.floatSpeed  = 0.0008 + Math.random() * 0.0006;
    n.floatAmpX   = 3 + Math.random() * 4;
    n.floatAmpY   = 2 + Math.random() * 3;
    n.baseX = 0; n.baseY = 0; // 基准位置，layout后赋值
    n.x = 0; n.y = 0;
  });

  function layout(){
    W = canvas.offsetWidth;
    H = canvas.offsetHeight;
    if(W === 0 || H === 0) return;
    canvas.width  = W;
    canvas.height = H;
    // 按聚类分组分配坐标
    const groups = [[], [], [], []];
    NODES.forEach(n => groups[n.cluster].push(n));
    groups.forEach((g, ci) => {
      const cp = CLUSTER_POS[ci];
      const cx = cp.rx * W, cy = cp.ry * H;
      // 聚类半径：让节点均匀分布，避免重叠
      const r  = Math.min(W, H) * (ci === 3 ? 0.17 : 0.15);
      g.forEach((n, j) => {
        const a = (j / g.length) * Math.PI * 2 - Math.PI / 2;
        n.baseX = cx + Math.cos(a) * r;
        n.baseY = cy + Math.sin(a) * r;
        n.x = n.baseX; n.y = n.baseY;
      });
    });
    initialized = true;
  }

  // 坐标转换
  function ts(x, y){ return [x * scale + ox, y * scale + oy]; }
  function fs(sx, sy){ return [(sx - ox) / scale, (sy - oy) / scale]; }

  // 连线颜色缓存（发光效果用时间驱动）
  function edgeGlow(t, isHovered){
    const phase = (t * 0.0012) % 1;
    const glow  = 0.3 + 0.5 * Math.abs(Math.sin(t * 0.0018));
    return isHovered
      ? { stroke: `rgba(0,255,136,${0.55 + glow * 0.3})`, width: 2.2, blur: 8 + glow * 6, shadowColor: '#00ff88' }
      : { stroke: `rgba(0,200,255,${0.08 + glow * 0.07})`, width: 1,   blur: 0,             shadowColor: '' };
  }

  // ════════════════════════════════════════════
  // 特殊节点动画函数
  // ════════════════════════════════════════════

  // 节点前置背景动画（画在节点主体之前）
  function drawNodeSpecialBg(ctx, nd, sx, sy, r, t, isH){
    ctx.save();
    switch(nd.id){

      case 'pressing': {
        // 高压迫：向内收缩的压迫脉冲环
        const rings = 3;
        for(let i = 0; i < rings; i++){
          const phase = ((t * 0.0018) + i / rings) % 1;
          // 从外向内收缩
          const rr = r * (2.8 - phase * 1.8);
          const alpha = phase < 0.5 ? phase * 2 * 0.35 : (1 - phase) * 2 * 0.35;
          ctx.beginPath(); ctx.arc(sx, sy, rr, 0, Math.PI*2);
          ctx.strokeStyle = `rgba(255,99,132,${alpha})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        break;
      }

      case 'counter-attack': {
        // 快速反击：从左到右飞出的速度线尾迹
        const lines = 4;
        for(let i = 0; i < lines; i++){
          const phase = ((t * 0.0022 + i * 0.25) % 1);
          const len = r * (0.8 + i * 0.3);
          const yOff = (i - 1.5) * r * 0.35;
          const x1 = sx - r * 1.8 + phase * r * 3.5;
          const alpha = Math.sin(phase * Math.PI) * 0.55;
          ctx.beginPath();
          ctx.moveTo(x1 - len * 0.6, sy + yOff);
          ctx.lineTo(x1, sy + yOff);
          ctx.strokeStyle = `rgba(255,206,86,${alpha})`;
          ctx.lineWidth = 1.2 - i * 0.15;
          ctx.stroke();
        }
        break;
      }

      case 'offside-trap': {
        // 越位陷阱：整体向前推进的虚线防线
        const linePhase = Math.sin(t * 0.0012) * 0.5 + 0.5; // 0~1 震荡
        const pushX = sx - r * 0.5 + linePhase * r * 1.0; // 防线左右推进
        const alpha = 0.5;
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.moveTo(pushX, sy - r * 1.8);
        ctx.lineTo(pushX, sy + r * 1.8);
        ctx.strokeStyle = `rgba(255,99,132,${alpha})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.setLineDash([]);
        // 三个小点代表后卫
        for(let i = 0; i < 3; i++){
          const dy = (i - 1) * r * 1.0;
          ctx.beginPath(); ctx.arc(pushX, sy + dy, 3, 0, Math.PI*2);
          ctx.fillStyle = `rgba(255,99,132,0.7)`; ctx.fill();
        }
        break;
      }

      case 'winger': {
        // 边锋：斜向速度光晕
        const speed = ((t * 0.002) % 1);
        for(let i = 0; i < 3; i++){
          const ph = (speed + i * 0.33) % 1;
          const x1 = sx - r * 2 + ph * r * 4;
          const y1 = sy + r * 1.3 - ph * r * 2.6;
          const alpha = Math.sin(ph * Math.PI) * 0.5;
          ctx.beginPath();
          ctx.moveTo(x1 - r*0.4, y1 + r*0.2);
          ctx.lineTo(x1, y1);
          ctx.strokeStyle = `rgba(255,120,40,${alpha})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        break;
      }
    }
    ctx.restore();
  }

  // 节点前景动画（画在节点主体之后、文字之前）
  function drawNodeSpecialFg(ctx, nd, sx, sy, r, t, isH){
    ctx.save();
    switch(nd.id){

      case 'gk': {
        // 门将：左右扑球弧形手势
        const angle = Math.sin(t * 0.0014) * 0.9; // -0.9 ~ 0.9 rad
        ctx.strokeStyle = 'rgba(255,206,86,0.6)';
        ctx.lineWidth = 2;
        // 手臂弧线
        ctx.beginPath();
        ctx.arc(sx, sy + r * 0.3, r * 1.25,
          Math.PI + angle - 0.6,
          Math.PI + angle + 0.6);
        ctx.stroke();
        // 手掌小点
        const hx = sx + Math.cos(Math.PI + angle) * r * 1.25;
        const hy = sy + r * 0.3 + Math.sin(Math.PI + angle) * r * 1.25;
        ctx.beginPath(); ctx.arc(hx, hy, 3.5, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,206,86,0.8)'; ctx.fill();
        break;
      }

      case 'xg': {
        // xG：右上角显示动态概率值
        const prob = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 0.0008));
        const probStr = prob.toFixed(2);
        ctx.font = `bold ${Math.max(7, 8*scale)}px monospace`;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';
        ctx.fillStyle = `rgba(0,255,136,0.85)`;
        ctx.fillText(probStr, sx + r * 1.0, sy - r * 1.1);
        // 右上角小圆点脉冲
        const dot = 0.5 + 0.5 * Math.sin(t * 0.002);
        ctx.beginPath(); ctx.arc(sx + r * 1.1, sy - r * 1.3, 3 + dot, 0, Math.PI*2);
        ctx.fillStyle = `rgba(0,255,136,${0.5 + dot*0.4})`; ctx.fill();
        break;
      }

      case 'possession': {
        // 控球率：外圈扇形进度条
        const pct = 0.52 + 0.18 * (0.5 + 0.5 * Math.sin(t * 0.0007));
        const startA = -Math.PI / 2;
        const endA = startA + pct * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(sx, sy, r * 1.35, startA, endA);
        ctx.strokeStyle = 'rgba(0,212,255,0.5)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        // 进度数字
        ctx.font = `bold ${Math.max(6, 7*scale)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = 'rgba(0,212,255,0.8)';
        ctx.fillText(Math.round(pct*100)+'%', sx, sy + r * 1.0);
        break;
      }

      case 'var': {
        // VAR：扫描线效果
        const scanY = sy - r * 1.2 + ((t * 0.0016) % 1) * r * 2.4;
        ctx.beginPath();
        ctx.moveTo(sx - r * 1.1, scanY);
        ctx.lineTo(sx + r * 1.1, scanY);
        ctx.strokeStyle = 'rgba(0,212,255,0.45)';
        ctx.lineWidth = 1;
        ctx.stroke();
        // 两侧方形框角
        const bx = sx - r * 1.1, by = sy - r * 1.1, bw = r * 2.2;
        const cs = 5;
        ctx.strokeStyle = 'rgba(0,212,255,0.4)'; ctx.lineWidth = 1.5;
        [[bx,by],[bx+bw,by],[bx,by+bw],[bx+bw,by+bw]].forEach(([cx,cy]) => {
          const dx = cx > sx ? -1 : 1, dy = cy > sy ? -1 : 1;
          ctx.beginPath(); ctx.moveTo(cx+dx*cs,cy); ctx.lineTo(cx,cy); ctx.lineTo(cx,cy+dy*cs); ctx.stroke();
        });
        break;
      }

      case 'offside': {
        // 越位规则：旗帜飘动
        const flagWave = Math.sin(t * 0.003);
        const fx = sx + r * 0.9, fy = sy - r * 0.5;
        ctx.strokeStyle = 'rgba(255,99,132,0.7)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy + r * 0.9); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.quadraticCurveTo(fx + r*0.55 + flagWave*4, fy + r*0.2, fx + r*0.1 + flagWave*2, fy + r*0.45);
        ctx.fillStyle = 'rgba(255,99,132,0.55)'; ctx.fill();
        break;
      }

      case 'penalty': {
        // 点球：向球门飞射的球弧线
        const shotPhase = ((t * 0.0014) % 1);
        const bx = sx - r * 0.8 + shotPhase * r * 1.6;
        const by = sy + r * 0.3 - Math.sin(shotPhase * Math.PI) * r * 0.7;
        const ballAlpha = Math.sin(shotPhase * Math.PI) * 0.8;
        ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,120,40,${ballAlpha})`; ctx.fill();
        // 轨迹尾巴
        const tail = 0.08;
        if(shotPhase > tail){
          const bx0 = sx - r * 0.8 + (shotPhase - tail) * r * 1.6;
          const by0 = sy + r * 0.3 - Math.sin((shotPhase - tail) * Math.PI) * r * 0.7;
          ctx.beginPath(); ctx.moveTo(bx0, by0); ctx.lineTo(bx, by);
          ctx.strokeStyle = `rgba(255,120,40,${ballAlpha * 0.4})`;
          ctx.lineWidth = 1.2; ctx.stroke();
        }
        break;
      }

    }
    ctx.restore();
  }

  // Tiki-Taka 节点周围小球传递动画
  function drawTikiTakaOrbit(ctx, t, scale, ox, oy){
    const tNode = NODES.find(n => n.id === 'tiki-taka');
    const amNode = NODES.find(n => n.id === 'am');
    const cmNode = NODES.find(n => n.id === 'cm');
    if(!tNode || !amNode || !cmNode) return;
    const triNodes = [tNode, amNode, cmNode];
    ctx.save();
    const numBalls = 3;
    for(let i = 0; i < numBalls; i++){
      const phase = ((t * 0.00055 + i / numBalls) % 1);
      // 在三角形三条边上传递
      const edge = Math.floor(phase * 3);
      const p = (phase * 3) % 1;
      const n1 = triNodes[edge], n2 = triNodes[(edge+1)%3];
      const [x1,y1] = [n1.x * scale + ox, n1.y * scale + oy];
      const [x2,y2] = [n2.x * scale + ox, n2.y * scale + oy];
      // 贝塞尔弧线中点
      const mx = (x1+x2)/2 - (y2-y1)*0.25;
      const my = (y1+y2)/2 + (x2-x1)*0.25;
      const bx = (1-p)*(1-p)*x1 + 2*(1-p)*p*mx + p*p*x2;
      const by = (1-p)*(1-p)*y1 + 2*(1-p)*p*my + p*p*y2;
      const alpha = 0.55 + 0.3 * Math.sin(phase * Math.PI * 6);
      ctx.beginPath(); ctx.arc(bx, by, 3.5, 0, Math.PI*2);
      ctx.fillStyle = `rgba(0,212,255,${alpha})`;
      ctx.shadowBlur = 8; ctx.shadowColor = '#00d4ff';
      ctx.fill();
      // 尾巴
      const pp = Math.max(0, p - 0.07);
      const bx0 = (1-pp)*(1-pp)*x1 + 2*(1-pp)*pp*mx + pp*pp*x2;
      const by0 = (1-pp)*(1-pp)*y1 + 2*(1-pp)*pp*my + pp*pp*y2;
      ctx.beginPath(); ctx.moveTo(bx0, by0); ctx.lineTo(bx, by);
      ctx.strokeStyle = `rgba(0,212,255,${alpha*0.35})`; ctx.lineWidth = 1.5;
      ctx.shadowBlur = 0;
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw(t){
    if(!initialized){ requestAnimationFrame(draw); return; }
    tick = t;
    ctx.clearRect(0,0,W,H);

    // ── 画连线 ──
    EDGES.forEach(([a, b]) => {
      const na = NODES.find(n => n.id === a), nb = NODES.find(n => n.id === b);
      if(!na || !nb) return;
      const isH = hovered && (hovered.id === a || hovered.id === b);
      const eg   = edgeGlow(t, isH);
      const [x1,y1] = ts(na.x, na.y), [x2,y2] = ts(nb.x, nb.y);

      if(eg.blur > 0){
        ctx.save();
        ctx.shadowBlur   = eg.blur;
        ctx.shadowColor  = eg.shadowColor;
      }
      // 发光底层（叠加两次使辉光更亮）
      if(isH){
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
        ctx.strokeStyle = 'rgba(0,255,136,0.15)'; ctx.lineWidth = 6; ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
      ctx.strokeStyle = eg.stroke; ctx.lineWidth = eg.width; ctx.stroke();
      if(eg.blur > 0) ctx.restore();

      // 流动光点（高亮连线时）
      if(isH){
        const prog = ((t * 0.0008) % 1);
        const px = x1 + (x2-x1)*prog, py = y1 + (y2-y1)*prog;
        ctx.beginPath(); ctx.arc(px, py, 2.5, 0, Math.PI*2);
        ctx.fillStyle = '#00ff88'; ctx.shadowBlur=10; ctx.shadowColor='#00ff88'; ctx.fill();
        ctx.shadowBlur=0;
      }
    });

    // ── 画节点 ──
    NODES.forEach(nd => {
      // 飘动：仅非拖拽状态
      if(dragging !== nd){
        const now = t * nd.floatSpeed + nd.floatPhase;
        nd.x = nd.baseX + Math.sin(now)       * nd.floatAmpX;
        nd.y = nd.baseY + Math.cos(now * 1.3)  * nd.floatAmpY;
      }
      const [sx, sy] = ts(nd.x, nd.y);
      const r   = 22 * scale;
      const isH = hovered && hovered.id === nd.id;
      const glowPulse = 0.6 + 0.4 * Math.abs(Math.sin(t * 0.0015 + nd.floatPhase));

      // ── 特殊节点专属前置动画 ──
      drawNodeSpecialBg(ctx, nd, sx, sy, r, t, isH);

      // 外圈发光晕
      if(isH){
        const grad = ctx.createRadialGradient(sx,sy, r*0.5, sx,sy, r*2.2);
        grad.addColorStop(0, nd.color + '44');
        grad.addColorStop(1, 'transparent');
        ctx.beginPath(); ctx.arc(sx,sy, r*2.2, 0, Math.PI*2);
        ctx.fillStyle = grad; ctx.fill();
      }

      // 节点主体
      ctx.save();
      ctx.shadowBlur   = isH ? 24 * glowPulse : 8 * glowPulse;
      ctx.shadowColor  = nd.color;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2);
      // 渐变填充
      const g2 = ctx.createRadialGradient(sx-r*.3, sy-r*.3, 0, sx, sy, r);
      g2.addColorStop(0, isH ? nd.color + 'cc' : 'rgba(18,36,72,0.95)');
      g2.addColorStop(1, isH ? nd.color + '55' : 'rgba(8,18,40,0.95)');
      ctx.fillStyle = g2; ctx.fill();
      ctx.strokeStyle = nd.color + (isH ? 'ff' : '99');
      ctx.lineWidth = isH ? 2.5 : 1.5; ctx.stroke();
      ctx.restore();

      // ── 特殊节点专属前景动画叠加 ──
      drawNodeSpecialFg(ctx, nd, sx, sy, r, t, isH);

      // 节点文字
      ctx.fillStyle  = isH ? '#fff' : 'rgba(255,255,255,0.85)';
      ctx.font       = `${isH ? 700 : 500} ${Math.max(9, 10*scale)}px 'Segoe UI','PingFang SC',sans-serif`;
      ctx.textAlign  = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(nd.label, sx, sy);
    });

    // ── Tiki-Taka 全局传球小球动画（覆盖在所有节点上层）──
    drawTikiTakaOrbit(ctx, t, scale, ox, oy);

    requestAnimationFrame(draw);
  }

  function nodeAt(sx, sy){
    const [wx, wy] = fs(sx, sy);
    return NODES.find(nd => {
      const dx = nd.x - wx, dy = nd.y - wy;
      return Math.sqrt(dx*dx + dy*dy) < 26;
    }) || null;
  }
  function getRect(){ return canvas.getBoundingClientRect(); }

  canvas.addEventListener('mousedown', e => {
    const r = getRect(), sx = e.clientX-r.left, sy = e.clientY-r.top;
    const nd = nodeAt(sx, sy);
    if(nd){ dragging = nd; dragMoved = false; }
    else{ panning = true; lmx = sx; lmy = sy; panMoved = false; }
  });

  canvas.addEventListener('mousemove', e => {
    const r = getRect(), sx = e.clientX-r.left, sy = e.clientY-r.top;
    hovered = nodeAt(sx, sy);
    canvas.style.cursor = hovered ? 'pointer' : (panning ? 'grabbing' : 'grab');
    if(dragging){
      const [wx,wy] = fs(sx, sy);
      if(Math.abs(wx-dragging.baseX)+Math.abs(wy-dragging.baseY) > 3) dragMoved = true;
      dragging.baseX = dragging.x = wx;
      dragging.baseY = dragging.y = wy;
    } else if(panning){
      ox += sx-lmx; oy += sy-lmy;
      if(Math.abs(sx-lmx)+Math.abs(sy-lmy) > 3) panMoved = true;
      lmx = sx; lmy = sy;
    }
  });

  canvas.addEventListener('mouseup', e => {
    if(dragging){
      // 未移动则视为点击节点
      if(!dragMoved) openModal(dragging.id);
      dragging = null; dragMoved = false;
      return;
    }
    if(panning && !panMoved){
      const r = getRect(), nd = nodeAt(e.clientX-r.left, e.clientY-r.top);
      if(nd) openModal(nd.id);
    }
    panning = false; panMoved = false;
  });

  canvas.addEventListener('wheel', e => {
    // 仅当鼠标悬停在节点上，或按住 Ctrl/Meta 时才缩放图谱（避免阻止页面正常滚动）
    if(hovered || e.ctrlKey || e.metaKey){
      e.preventDefault();
      scale = Math.max(.3, Math.min(3, scale * (e.deltaY > 0 ? 0.9 : 1.1)));
    }
  }, {passive: false});

  // 触摸支持
  let lastTouch = null;
  canvas.addEventListener('touchstart', e => {
    if(e.touches.length === 1){
      const r = getRect(), t0 = e.touches[0];
      const sx = t0.clientX-r.left, sy = t0.clientY-r.top;
      const nd = nodeAt(sx, sy);
      if(nd){ dragging = nd; dragMoved = false; lastTouch = {sx, sy}; }
      else{ panning = true; lmx = sx; lmy = sy; panMoved = false; lastTouch = {sx,sy}; }
    }
    e.preventDefault();
  }, {passive:false});

  canvas.addEventListener('touchmove', e => {
    if(e.touches.length === 1){
      const r = getRect(), t0 = e.touches[0];
      const sx = t0.clientX-r.left, sy = t0.clientY-r.top;
      if(dragging){
        const [wx,wy] = fs(sx,sy);
        if(Math.abs(wx-dragging.baseX)+Math.abs(wy-dragging.baseY) > 3) dragMoved = true;
        dragging.baseX = dragging.x = wx; dragging.baseY = dragging.y = wy;
      } else if(panning){
        ox += sx-lmx; oy += sy-lmy; lmx=sx; lmy=sy; panMoved=true;
      }
    }
    e.preventDefault();
  }, {passive:false});

  canvas.addEventListener('touchend', e => {
    if(dragging){
      if(!dragMoved) openModal(dragging.id);
      dragging=null; dragMoved=false; lastTouch=null; return;
    }
    if(!panMoved){
      const r = getRect(), t0 = e.changedTouches[0];
      const nd = nodeAt(t0.clientX-r.left, t0.clientY-r.top);
      if(nd) openModal(nd.id);
    }
    panning=false; panMoved=false; lastTouch=null;
  });

  // ResizeObserver 确保 iframe 可见后正确初始化
  function tryInit(){
    const ow = canvas.offsetWidth, oh = canvas.offsetHeight;
    if(ow > 0 && oh > 0){ layout(); }
  }
  // 延迟一帧，等 resizeGraphWrap 设置的 style.height 生效后再读 offsetHeight
  requestAnimationFrame(tryInit);

  if(window.ResizeObserver){
    new ResizeObserver(() => { if(!initialized) tryInit(); else layout(); })
      .observe(canvas);
  }
  // 定期重试（针对 iframe 初始隐藏问题）
  let retryCount = 0;
  const retryTimer = setInterval(() => {
    if(initialized || retryCount++ > 30){ clearInterval(retryTimer); return; }
    tryInit();
  }, 100);

  requestAnimationFrame(draw);
})();

// 卡片渲染
// ════════════════════════════════════════════
let curCat = 'all', curQ = '';
// 声明在 renderCards() 调用之前，避免 let 暂时性死区（TDZ）
let _sectionObserver = null;
let _observerLocked = false;
function renderCards(){
  const con = document.getElementById('cards-container');
  let items = KB.filter(k => {
    const catOk = curCat === 'all' || k.cat === curCat;
    const q = curQ.trim().toLowerCase();
    const qOk = !q || k.name.includes(q) || k.en.toLowerCase().includes(q)
              || (k.short&&k.short.includes(q)) || (k.detail&&k.detail.includes(q));
    return catOk && qOk;
  });
  if(!items.length){
    con.innerHTML='<div class="empty-tip"><i class="fas fa-search-minus"></i>未找到匹配术语，请尝试其他关键词</div>';
    return;
  }
  const cats = curCat === 'all' ? ['position','tactics','skill','rule','stats','event'] : [curCat];
  let html = '';
  cats.forEach(cat => {
    const group = items.filter(k => k.cat === cat);
    if(!group.length) return;
    const catIcon = {position:'fas fa-running',tactics:'fas fa-chess',skill:'fas fa-futbol',
                     rule:'fas fa-flag',stats:'fas fa-chart-bar',event:'fas fa-trophy'}[cat] || 'fas fa-circle';
    // 为每个分类区块添加 id，供导航跳转和 IntersectionObserver 使用
    html += `<div class="section-hd" id="section-${cat}" data-cat="${cat}"><i class="${catIcon}" style="color:var(--primary);font-size:.85rem"></i>${CAT_NAMES[cat]||cat}<span class="badge">${group.length}</span></div>`;
    html += '<div class="cards-grid">';
    group.forEach(k => {
      const tags = k.tags.map(t =>
        `<span class="tag" style="color:${t.c};border-color:${t.c};background:${t.b}">${t.t}</span>`
      ).join('');
      html += `<div class="kcard" style="--kc:${k.color};--kc-glow:${k.bg}" onclick="openModal('${k.id}')">
        <div class="kcard-head">
          <div class="kcard-ico" style="background:${k.bg};color:${k.color}"><i class="${k.icon}"></i></div>
          <div><div class="kcard-name">${k.name}</div><div class="kcard-en">${k.en}</div></div>
        </div>
        <div class="kcard-desc">${k.short}</div>
        <div class="kcard-tags">${tags}</div>
      </div>`;
    });
    html += '</div>';
  });
  con.innerHTML = html;
  // 重新绑定 IntersectionObserver（内容刷新后需重建）
  _bindSectionObserver();
}
renderCards();

// 分类切换 & 搜索
// ════════════════════════════════════════════

// 必须在 renderCards()/switchCat 调用之前声明，避免 let 暂时性死区（TDZ）报错
// graph-wrap 显隐控制：点击具体分类时隐藏图谱，"全部"时恢复
function _setGraphVisible(visible){
  const gw = document.getElementById('graph-wrap');
  if(!gw) return;
  if(visible){
    gw.classList.remove('graph-hidden');
  } else {
    gw.classList.add('graph-hidden');
  }
}

// 更新导航高亮
function _highlightCatBtn(cat){
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.cat-btn[data-cat="${cat}"]`)
           || document.querySelector('.cat-btn[data-cat="all"]');
  if(btn) btn.classList.add('active');
}

// 滚动高亮：用 IntersectionObserver 监听 section-hd，滚动到哪个模块就高亮哪个按钮
function _bindSectionObserver(){
  if(_sectionObserver){ _sectionObserver.disconnect(); }
  const mainEl = document.querySelector('.main');
  _sectionObserver = new IntersectionObserver(function(entries){
    if(_observerLocked) return;
    // 找所有可见 section 中 top 最小的（最靠近顶部）
    const visible = entries.filter(function(e){ return e.isIntersecting; });
    if(!visible.length) return;
    visible.sort(function(a,b){ return a.boundingClientRect.top - b.boundingClientRect.top; });
    _highlightCatBtn(visible[0].target.dataset.cat);
  }, {
    root: mainEl || null,
    rootMargin: '-5% 0px -55% 0px',
    threshold: 0
  });
  document.querySelectorAll('.section-hd[data-cat]').forEach(function(el){
    _sectionObserver.observe(el);
  });
}

// 全局分类切换函数
function switchCat(cat){
  if(cat === 'all'){
    // 点击"全部"：确保全部模式，图谱显示，滚回顶部
    curCat = 'all';
    _highlightCatBtn('all');
    _setGraphVisible(true);
    renderCards();
    var mainEl = document.querySelector('.main');
    if(mainEl) mainEl.scrollTo({top: 0, behavior: 'smooth'});
    return;
  }

  // 点击具体分类：保持"全部"模式显示所有卡片，滚动跳转到对应 section
  // 若当前不是 all 模式，先切回 all 并重新渲染
  if(curCat !== 'all'){
    curCat = 'all';
    _setGraphVisible(false);
    renderCards();
  }

  // 高亮导航按钮
  _highlightCatBtn(cat);

  // 临时锁住 IntersectionObserver，防止滚动过程中高亮被覆盖
  _observerLocked = true;
  clearTimeout(window._obsLockTimer);
  window._obsLockTimer = setTimeout(function(){ _observerLocked = false; }, 800);

  // 跳转到对应 section（等 renderCards 完成 DOM 更新后执行）
  requestAnimationFrame(function(){
    var sec = document.getElementById('section-' + cat);
    var mainEl = document.querySelector('.main');
    if(sec && mainEl){
      // 计算 section 相对于 .main 滚动容器的偏移，减去 cat-bar 高度（约 44px）留出间距
      var secTop = sec.getBoundingClientRect().top;
      var mainTop = mainEl.getBoundingClientRect().top;
      var offset = mainEl.scrollTop + (secTop - mainTop) - 8;
      mainEl.scrollTo({top: offset, behavior: 'smooth'});
    }
  });
}

document.getElementById('search-input').addEventListener('input', e => {
  curQ = e.target.value;
  if(curQ){
    curCat = 'all';
    _highlightCatBtn('all');
    _setGraphVisible(true);
  }
  renderCards();
});

// 弹窗
// ════════════════════════════════════════════
function openModal(id){
  const k = ID_MAP[id]; if(!k) return;
  const pts = k.points.map(p => `<li>${p}</li>`).join('');
  const rel = k.related
    .map(rid => { const r = ID_MAP[rid]; return r ? `<span class="rchip" onclick="openModal('${rid}')">${r.name}</span>` : ''; })
    .filter(Boolean).join('');
  // 3D动画支持的术语
  const anim3dIds = ['pressing','tiki-taka','counter-attack','offside-trap','cross',
                     'through-ball','dribble','penalty','offside','formation-433','formation-442',
                     'gk','cb','winger','cf','false9','tackle','header',
                     'corner','handball','formation-352'];
  const has3d = anim3dIds.includes(id);
  const animHtml = has3d
    ? `<div class="anim3d-wrap" id="anim3d-wrap">
        <div class="anim3d-loading" id="anim3d-loading"><i class="fas fa-spinner fa-spin"></i> 3D 加载中…</div>
        <div class="anim3d-badge">3D · 互动</div>
        <div class="anim3d-label" id="anim3d-label"></div>
       </div>`
    : '';
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-ico" style="background:${k.bg};color:${k.color}"><i class="${k.icon}"></i></div>
    <div class="modal-title">${k.name}</div>
    <div class="modal-en">${k.en}</div>
    ${animHtml}
    <div class="msec"><div class="msec-title"><i class="fas fa-info-circle"></i> 概述</div><div class="msec-text">${k.detail}</div></div>
    <div class="msec"><div class="msec-title"><i class="fas fa-list-ul"></i> 要点</div><ul class="mlist">${pts}</ul></div>
    ${rel ? `<div class="msec"><div class="msec-title"><i class="fas fa-link"></i> 相关术语</div><div class="related-chips">${rel}</div></div>` : ''}
  `;
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal-box').scrollTop = 0;
  if(has3d){ setTimeout(() => start3DScene(id), 60); }
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  stop3DScene();
}


// ════════════════════════════════════════════
// 3D 战术演示引擎（Three.js）
// ════════════════════════════════════════════
let _3d = null; // { renderer, scene, camera, raf, dispose }

function stop3DScene(){
  if(!_3d) return;
  cancelAnimationFrame(_3d.raf);
  _3d.dispose();
  _3d = null;
}

function start3DScene(id){
  stop3DScene();

  // Three.js 尚未加载：等待最多 5 秒后重试，若仍失败则显示提示
  if(typeof THREE === 'undefined'){
    const wrap = document.getElementById('anim3d-wrap'); 
    const loading = document.getElementById('anim3d-loading');
    if(loading) loading.textContent = '3D 引擎加载中…';
    let waited = 0;
    const timer = setInterval(function(){
      waited += 200;
      if(typeof THREE !== 'undefined'){
        clearInterval(timer);
        start3DScene(id);  // THREE 已就绪，重新启动
      } else if(waited >= 5000){
        clearInterval(timer);
        if(loading){
          loading.style.display = 'flex';
          loading.innerHTML = '<i class="fas fa-exclamation-circle" style="color:#ff6384;margin-right:6px"></i>3D 动画加载失败（网络异常），请刷新页面重试';
        }
      }
    }, 200);
    return;
  }
  const wrap = document.getElementById('anim3d-wrap'); if(!wrap) return;
  const loading = document.getElementById('anim3d-loading');
  const labelEl = document.getElementById('anim3d-label');

  // ── 渲染器 ──
  const W = wrap.clientWidth || 480, H = wrap.clientHeight || 220;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x000000, 0);
  wrap.appendChild(renderer.domElement);
  if(loading) loading.style.display = 'none';

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x071428, 28, 55);

  // ── 相机 ──
  const camera = new THREE.PerspectiveCamera(52, W / H, 0.1, 100);
  camera.position.set(0, 9, 14);
  camera.lookAt(0, 0, 0);

  // ── 灯光 ──
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(8, 16, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(512, 512);
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 60;
  sun.shadow.camera.left = -16; sun.shadow.camera.right = 16;
  sun.shadow.camera.top  = 12;  sun.shadow.camera.bottom = -12;

  fill.position.set(-8, 5, -5);
  scene.add(fill);

  // ── 工具函数 ──
  // 创建"小人"：高挑胶囊身体 + 球形头 + 手臂 + 腿
  function makePlayer(bodyColor, headColor){
    const g = new THREE.Group();
    // ── 几何体全部以"脚底 = y=0"为基准向上排列 ──
    // 脚 (底部 y=0, 高0.09) → center y=0.045 → 0~0.09
    const footGeo = new THREE.BoxGeometry(0.14, 0.09, 0.28);
    const footMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    [-0.13, 0.13].forEach((dx, i) => {
      const foot = new THREE.Mesh(footGeo, footMat);
      foot.position.set(dx, 0.045, 0.07);
      g.add(foot);
      g.userData['foot'+i] = foot;
    });
    // 腿 (高0.65) → 底部=0.09, center=0.09+0.325=0.415 → top=0.74
    const legGeo = new THREE.CylinderGeometry(0.09, 0.08, 0.65, 7);
    const legMat = new THREE.MeshLambertMaterial({ color: 0x222244 });
    [-0.13, 0.13].forEach((dx, i) => {
      const leg = new THREE.Mesh(legGeo, legMat);
      leg.position.set(dx, 0.415, 0);
      leg.castShadow = true;
      g.add(leg);
      g.userData['leg'+i] = leg;
    });
    // 躯干 (高1.1) → 底部=0.74, center=0.74+0.55=1.29 → top=1.84
    const bodyGeo = new THREE.CylinderGeometry(0.16, 0.18, 1.1, 8);
    const bodyMat = new THREE.MeshLambertMaterial({ color: bodyColor });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.29;
    body.castShadow = true;
    g.add(body);
    // 手臂 → center 与躯干上半部对齐 y=1.49
    const armGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.65, 6);
    const armMat = new THREE.MeshLambertMaterial({ color: bodyColor });
    [-1, 1].forEach((side, i) => {
      const arm = new THREE.Mesh(armGeo, armMat);
      arm.position.set(side * 0.34, 1.49, 0);
      arm.rotation.z = side * 0.45;
      arm.castShadow = true;
      g.add(arm);
      g.userData['arm'+i] = arm;
    });
    // 头 → 躯干顶部 y=1.84, 头球半径0.26 → center y=1.84+0.26=2.10
    const headGeo = new THREE.SphereGeometry(0.26, 12, 10);
    const headMat = new THREE.MeshLambertMaterial({ color: 0xf5c87a });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.10;
    head.castShadow = true;
    g.add(head);
    // 发帽
    const capGeo = new THREE.SphereGeometry(0.20, 10, 6, 0, Math.PI*2, 0, Math.PI*0.55);
    const capMat = new THREE.MeshLambertMaterial({ color: headColor });
    const cap = new THREE.Mesh(capGeo, capMat);
    cap.position.y = 2.10;
    g.add(cap);
    // group 的 y = 0 时脚底恰好在世界 y=0（站在地面上）
    // 动画中若需上跳，直接 player.position.y = jumpOffset（正值=升空）
    return g;
  }

  // 足球（亮橙黄色，更大，黑色花纹明显）
  function makeBall(){
    const geo = new THREE.SphereGeometry(0.26, 16, 12);
    const mat = new THREE.MeshLambertMaterial({ color: 0xf5a623 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    // 黑色花纹（线框叠加）
    const wf = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(0.27, 1)),
      new THREE.LineBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.75 })
    );
    mesh.add(wf);
    mesh.position.y = 0.26;
    return mesh;
  }

  // 球场地面（绿色条纹）
  function makeField(fw, fd){
    const group = new THREE.Group();
    // 主草地
    const geo = new THREE.PlaneGeometry(fw, fd);
    const mat = new THREE.MeshLambertMaterial({ color: 0x2d7a3a });
    const plane = new THREE.Mesh(geo, mat);
    plane.rotation.x = -Math.PI/2;
    plane.receiveShadow = true;
    group.add(plane);

    // 条纹（交替深浅）
    const stripeW = fw / 8;
    for(let i = 0; i < 8; i++){
      if(i % 2 === 0) continue;
      const sg = new THREE.PlaneGeometry(stripeW, fd);
      const sm = new THREE.MeshLambertMaterial({ color: 0x28703510, transparent: true, opacity: 0.18 });
      const s = new THREE.Mesh(sg, sm);
      s.rotation.x = -Math.PI/2;
      s.position.set(-fw/2 + stripeW*(i+0.5), 0.001, 0);
      group.add(s);
    }

    // 白线（边框 + 中线 + 中圈 + 禁区）
    const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.65 });
    function addRect(x,z,w,d){
      const pts = [
        new THREE.Vector3(x-w/2,0.01,z-d/2), new THREE.Vector3(x+w/2,0.01,z-d/2),
        new THREE.Vector3(x+w/2,0.01,z+d/2), new THREE.Vector3(x-w/2,0.01,z+d/2),
        new THREE.Vector3(x-w/2,0.01,z-d/2)
      ];
      const g = new THREE.BufferGeometry().setFromPoints(pts);
      group.add(new THREE.Line(g, lineMat));
    }
    addRect(0, 0, fw, fd); // 边框
    // 中线
    const midPts = [new THREE.Vector3(0,0.01,-fd/2),new THREE.Vector3(0,0.01,fd/2)];
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(midPts), lineMat));
    // 中圈
    const circPts = [];
    for(let i=0;i<=48;i++) circPts.push(new THREE.Vector3(Math.cos(i/48*Math.PI*2)*2,0.01,Math.sin(i/48*Math.PI*2)*2));
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(circPts), lineMat));
    // 左禁区
    addRect(-fw/2+3, 0, 6, fd*0.45);
    // 右禁区
    addRect(fw/2-3, 0, 6, fd*0.45);
    // 球门构建函数（x方向面向场内，sign=+1右门/-1左门）
    function buildGoal(cx, sign){
      const postGeo = new THREE.CylinderGeometry(0.055, 0.055, 2.2, 8);
      const postMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
      // 左右立柱
      [-1.1, 1.1].forEach(zz => {
        const p = new THREE.Mesh(postGeo, postMat);
        p.position.set(cx, 1.1, zz);
        p.castShadow = true;
        group.add(p);
      });
      // 横梁（沿Z轴方向连接两立柱顶部）
      const barGeo = new THREE.CylinderGeometry(0.055, 0.055, 2.2, 8);
      const bar = new THREE.Mesh(barGeo, postMat);
      bar.position.set(cx, 2.2, 0);
      bar.rotation.x = Math.PI / 2; // 沿Z轴方向铺开
      bar.castShadow = true;
      group.add(bar);
      // 背网（半透明）
      const netGeo = new THREE.PlaneGeometry(0.9, 2.2);
      const netMat = new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.12, side: THREE.DoubleSide
      });
      // 顶网（水平）
      const topNet = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 2.2), netMat);
      topNet.rotation.x = Math.PI / 2;
      topNet.position.set(cx + sign * 0.45, 2.2, 0);
      group.add(topNet);
      // 背网（垂直）
      const backNet = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2), netMat);
      backNet.rotation.y = Math.PI / 2;
      backNet.position.set(cx + sign * 0.9, 1.1, 0);
      group.add(backNet);
      // 球门线白线标记
      const lineMat2 = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });
      const glPts = [
        new THREE.Vector3(cx, 0.01, -1.1), new THREE.Vector3(cx, 0.01, 1.1)
      ];
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(glPts), lineMat2));
    }
    buildGoal(fw / 2, +1);  // 右球门（背网向右）
    buildGoal(-fw / 2, -1); // 左球门（背网向左）
    return group;
  }

  // lerp 工具
  const lerp = (a,b,t) => a+(b-a)*t;

  // ── 各术语3D场景 ──
  const FW = 18, FD = 11; // 场地宽深
  scene.add(makeField(FW, FD));

  const scenes3d = {

    // ── 高压迫 ──
    pressing: () => {
      const label = '高压迫 · Gegenpressing — 失球后5秒内围抢';
      const defenders = [], pressers = [];
      const defPositions  = [[-5,0,-3],[-5,0,0],[-5,0,3]];
      const presPositions = [[-2,0,-3],[-2,0,0],[-2,0,3]];
      defPositions.forEach(p=>{ const pl=makePlayer(0xff4466,0xffaaaa); pl.position.set(...p); scene.add(pl); defenders.push(pl); });
      presPositions.forEach(p=>{ const pl=makePlayer(0x00cc66,0x88ffbb); pl.position.set(...p); scene.add(pl); pressers.push(pl); });
      const ball = makeBall(); ball.position.set(-5,0.26,0); scene.add(ball);
      // 箭头（用Line模拟）
      const arrows = pressers.map((pr,i)=>{
        const pts=[pr.position.clone(),defenders[i].position.clone()];
        const g=new THREE.BufferGeometry().setFromPoints(pts);
        const line=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x00ff88,transparent:true,opacity:0.6}));
        scene.add(line); return {line,pr,def:defenders[i]};
      });
      camera.position.set(0,11,10); camera.lookAt(-3,0,0);
      let t=0;
      return { label, update(dt){ t+=dt;
        const adv = 0.5+0.5*Math.sin(t*0.9);
        pressers.forEach((pr,i)=>{
          pr.position.x = lerp(-2,-4.2,adv);
          // 腿部摆动
          const leg = 0.3*Math.sin(t*3+i);
          if(pr.userData.leg0) pr.userData.leg0.rotation.x = leg;
          if(pr.userData.leg1) pr.userData.leg1.rotation.x = -leg;
          // 更新箭头
          const a=arrows[i];
          const pts=[a.pr.position.clone(),a.def.position.clone()];
          a.line.geometry.setFromPoints(pts); a.line.geometry.computeBoundingSphere();
        });
        // 相机轻微晃动
        camera.position.x = -3 + Math.sin(t*0.3)*0.5;
      }};
    },

    // ── Tiki-Taka ──
    'tiki-taka': () => {
      const label = 'Tiki-Taka · 菱形快速短传';
      const positions = [[-4,0,-3],[-4,0,3],[-1,0,-2],[-1,0,2],[1,0,0]];
      const colors = [0x00aaff,0x00aaff,0x00aaff,0x00aaff,0x00aaff];
      const players = positions.map((p,i)=>{
        const pl=makePlayer(colors[i],0xaaddff); pl.position.set(...p); scene.add(pl); return pl;
      });
      const ball=makeBall(); scene.add(ball);
      camera.position.set(0,9,12); camera.lookAt(-1,0,0);
      const passes=[[0,2],[2,4],[4,3],[3,1],[1,0],[0,4],[4,2]];
      let passIdx=0,passT=0,PASS_DUR=1.2;
      let t=0;
      return { label, update(dt){ t+=dt; passT+=dt;
        if(passT>=PASS_DUR){ passT=0; passIdx=(passIdx+1)%passes.length; }
        const [ai,bi]=passes[passIdx], p=passT/PASS_DUR;
        const pa=players[ai].position, pb=players[bi].position;
        ball.position.x=lerp(pa.x,pb.x,p);
        ball.position.z=lerp(pa.z,pb.z,p);
        ball.position.y=0.26+0.5*Math.sin(p*Math.PI);
        ball.rotation.z+=dt*6;
        // 持球者朝接球者方向看
        players[ai].rotation.y=Math.atan2(pb.x-pa.x,pb.z-pa.z);
        // 相机慢转
        camera.position.x=Math.sin(t*0.15)*5;
        camera.position.z=12+Math.cos(t*0.15)*2;
        camera.lookAt(-1,0,0);
      }};
    },

    // ── 快速反击 ──
    'counter-attack': () => {
      const label = '快速反击 · Counter Attack — 低位防守→闪电冲刺';
      const defTeam=[], runners=[];
      [[-7,0,-3],[-7,0,0],[-7,0,3],[-6,0,0]].forEach(p=>{
        const pl=makePlayer(0x00cc66,0x88ffbb); pl.position.set(...p); scene.add(pl); defTeam.push(pl);
      });
      [[2,0,-2],[2,0,2]].forEach(p=>{

      const runner=makePlayer(0xffcc00,0xffee88); runner.position.set(-5,0,0); scene.add(runner); runners.push(runner);
      const ball=makeBall(); ball.position.set(-5,0.26,0); scene.add(ball);
      camera.position.set(0,10,13); camera.lookAt(2,0,0);
      let t=0,phase=0;
      return { label, update(dt){ t+=dt; phase+=dt*0.4;
        const p=(Math.sin(phase)+1)/2; // 0~1 往复
        runner.position.x=lerp(-5,6,p);
        runner.position.z=lerp(0,-2,Math.sin(phase*0.7)*0.5+0.5);

        const leg=0.4*Math.sin(t*5);
        runner.userData.leg0.rotation.x=leg; runner.userData.leg1.rotation.x=-leg;
        // 球跟随
        const bDelay=Math.max(0,p-0.1);
        ball.position.x=lerp(-5,6,bDelay);
        ball.position.y=0.26+0.3*Math.abs(Math.sin(bDelay*Math.PI*4));

        runner.rotation.y=-Math.PI/2;

    // ── 越位陷阱 ──
    'offside-trap': () => {
      const label = '越位陷阱 · Offside Trap — 防线整体前推';
      const defs=[];
      [-4,0,4].forEach(z=>{
        const pl=makePlayer(0xff4466,0xffaaaa); pl.position.set(0,0,z); scene.add(pl); defs.push(pl);
      });

      const fwd=makePlayer(0xffcc00,0xffee88); fwd.position.set(3,0,-1); scene.add(fwd);

      const offsideLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(linePts),lineMat);

        // 前锋始终比防线前

        offsideLine.material.opacity=0.4+0.6*Math.abs(Math.sin(t*3));

    // ── 传中 ──
    cross: () => {
      const label = '传中 · Cross — 下底弧线传中';
      const winger=makePlayer(0xff7828,0xffbb66); winger.position.set(6,0,5); scene.add(winger);
      const cf=makePlayer(0x00cc66,0x88ffbb); cf.position.set(6.5,0,-1); scene.add(cf);

    'through-ball': () => {

        runner.position.z=lerp(-1,-1.5,p);

      // 点球点标记
      const dotGeo = new THREE.CircleGeometry(0.12, 12);
      const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.7, transparent: true });
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.rotation.x = -Math.PI / 2;
      dot.position.set(-3, 0.01, 0);
      scene.add(dot);

      // 相机：侧面稍高，能看到射手+球+球门全景
      camera.position.set(-1, 5, 12);
      camera.lookAt(3, 1, 0);

      let t = 0, phase = 0;
      // gkSide 决定门将扑救方向，每次射门随机
      let gkSide = 1, shotSide = -1;
      let nextShotDecided = false;

      return { label, update(dt) {
        t += dt; phase += dt * 0.38;
        const cycleT = phase % 1;

        // 每个周期开始时决定射向和门将方向
        if (cycleT < 0.02 && !nextShotDecided) {
          shotSide = Math.random() > 0.5 ? 1.2 : -1.2;
          gkSide = Math.random() > 0.45 ? shotSide : -shotSide; // 有时扑对有时扑错
          nextShotDecided = true;
        }
        if (cycleT > 0.1) nextShotDecided = false;

        if (cycleT < 0.55) {
          // 助跑/蓄力阶段：射手向球门方向小幅前进，腿部摆动
          const runP = cycleT / 0.55;
          shooter.position.x = -3 + runP * 0.8;
          shooter.position.z = 0;
          // 腿部跑动
          const leg = 0.5 * Math.sin(t * 5);
          shooter.userData.leg0.rotation.x = leg;
          shooter.userData.leg1.rotation.x = -leg;
          // 球静止在点球点
          ball.position.set(-3, 0.26, 0);
          ball.rotation.set(0, 0, 0);
          // 门将原地等待，小幅摇摆
          gkP.position.z = Math.sin(t * 1.8) * 0.6;
          gkP.position.y = 0;
        } else {
          // 射门阶段（0.55~1.0）
          const sp = (cycleT - 0.55) / 0.45;
          // 球从点球点飞向球门角落
          ball.position.x = -3 + sp * 11.5;
          ball.position.z = shotSide * sp * 1.0;
          // 低平球弧线（稍微离地）
          ball.position.y = 0.26 + 1.2 * Math.sin(sp * Math.PI) * (1 - sp * 0.5);
          ball.rotation.z += dt * 14;
          // 门将扑救：快速向扑救侧滑动并俯身
          gkP.position.z = gkSide * Math.min(sp * 4, 1.8);
          gkP.position.y = Math.max(0, sp - 0.5) * 1.2;
          gkP.rotation.z = gkSide * Math.min(sp * 1.5, 0.8);
          // 射手射门后踢腿
          shooter.userData.leg0.rotation.x = -0.8 * Math.min(sp * 3, 1);
          shooter.userData.leg1.rotation.x = 0.3;
        }

        camera.position.x = -1 + Math.sin(t * 0.22) * 1.0;
        camera.lookAt(3, 1.5, 0);
      }};
    },

    // ── 头球 ──
    header: () => {
      const label = '头球 · Header — 传中球精准落于头顶';
      // 主攻头球球员（绿队）
      const p1=makePlayer(0x00cc66,0x88ffbb); p1.position.set(2,0,-0.8); scene.add(p1);
      // 防守争顶（红队）
      const p2=makePlayer(0xff4466,0xffaaaa); p2.position.set(2.3,0,0.9); scene.add(p2);
      // 传中球员
      const crosser=makePlayer(0x00aaff,0xaaddff); crosser.position.set(7,0,4.5); scene.add(crosser);
      const ball=makeBall(); scene.add(ball);

      // 头球接触时的光晕圆环（绿色）
      const ringGeo = new THREE.TorusGeometry(0.45, 0.06, 8, 24);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0 });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      scene.add(ring);

      camera.position.set(-2,8,12); camera.lookAt(2,2.5,0);
      let t=0;
      // makePlayer 头部中心静止时 y=2.10，跳起 1.05 后头部 y≈3.15
      const HEAD_H = 3.15; // 球与头接触时的高度
      const CYCLE = 3.0;   // 动画循环周期(秒)
      return { label, update(dt){ t+=dt;
        const phase = (t % CYCLE) / CYCLE; // 0→1 线性循环

        // ── 球的飞行路径 ──
        // 阶段0~0.7：球从传中球员 x=7,z=4.5 飞向攻手头顶 x=2,z=-0.8
        // 阶段0.7~1：球打完头球后继续飞出（向球门方向 x=-2）
        let ballX, ballZ, ballY;
        if (phase < 0.7) {
          const fp = phase / 0.7; // 0→1
          ballX = lerp(7, 2, fp);
          ballZ = lerp(4.5, -0.8, fp);
          // 标准对称抛物线：fp=0 时 y=0.26（地面），fp=0.5 时峰值=HEAD_H，fp=1 时 y=HEAD_H（头部接触）
          // 让球在 fp=1 精确落到头顶，用半段抛物线：y = HEAD_H * sin(fp * PI/2) + 0.26*(1-sin(fp*PI/2)) 不够直观
          // 改用：从地面出发，峰值比目标更高，在 fp→1 时降到 HEAD_H
          // 采用两段：fp<0.45 上升到 HEAD_H+0.4，fp>0.45 下降至 HEAD_H
          if (fp < 0.45) {
            ballY = lerp(0.26, HEAD_H + 0.4, fp / 0.45);
          } else {
            ballY = lerp(HEAD_H + 0.4, HEAD_H, (fp - 0.45) / 0.55);
          }
        } else {
          const fp = (phase - 0.7) / 0.3; // 0→1（头球后飞出）
          ballX = lerp(2, -3, fp);
          ballZ = lerp(-0.8, -0.8, fp);
          // 头球后有向下弧线
          ballY = Math.max(0.26, HEAD_H * (1 - fp * fp * 1.2));
        }
        ball.position.set(ballX, ballY, ballZ);
        ball.rotation.z += dt * 7;
        ball.rotation.x += dt * 4;

        // ── 球员跳跃 ──
        // p1（绿队）在 phase≈0.68 时头部恰好在 HEAD_H
        // 需要 p1.y + 2.10 = HEAD_H => p1.y = 1.05 在 phase=0.68 时
        const jumpPhase = 0.68;
        const jumpWindow = 0.18;
        const jumpNorm = Math.max(0, 1 - Math.abs(phase - jumpPhase) / jumpWindow);
        const jumpH1 = 1.05 * Math.sin(jumpNorm * Math.PI);
        p1.position.y = jumpH1;
        // p2（红队）稍偏，晚一点
        const jumpNorm2 = Math.max(0, 1 - Math.abs(phase - (jumpPhase + 0.04)) / (jumpWindow * 0.9));
        const jumpH2 = 0.85 * Math.sin(jumpNorm2 * Math.PI);
        p2.position.y = jumpH2;

        // ── 接触判定：ball.y 与 p1 头部 y 差值小于 0.28 时显示光晕 ──
        const headWorldY = p1.position.y + 2.10;
        const contactDist = Math.abs(ball.position.y - headWorldY) + Math.abs(ball.position.x - p1.position.x) * 0.5;
        const contactIntensity = Math.max(0, 1 - contactDist / 0.35);
        ring.position.set(p1.position.x, headWorldY, p1.position.z);
        ring.rotation.x = Math.PI / 2;
        ring.rotation.z = t * 3;
        ringMat.opacity = contactIntensity * 0.95;
        ring.scale.setScalar(1 + contactIntensity * 0.5);

        // 传中球员挥臂
        crosser.userData.arm0.rotation.z = -0.6 - 0.4 * Math.abs(Math.sin(t * 1.2));
        crosser.userData.arm1.rotation.z = 0.6 + 0.4 * Math.abs(Math.sin(t * 1.2));

        camera.position.x = -1 + Math.sin(t * 0.18) * 2.5;
        camera.lookAt(2, 2.8, 0);
      }};
    },

    // ── 角球 ──
    corner: () => {
      const label = '角球 · Corner Kick — 定位球传中攻门';
      // 角球主罚球员（左侧角旗区）
      const kicker = makePlayer(0x00aaff, 0xaaddff);
      kicker.position.set(-8.5, 0, -5);
      kicker.rotation.y = Math.atan2(8, 5); // 朝向禁区中路
      scene.add(kicker);

      // 禁区内3名进攻球员
      const posAtk = [{x:1,z:-2},{x:-0.5,z:0},{x:2,z:1.5}];
      const attackers = posAtk.map(p => {
        const pl = makePlayer(0x00cc66, 0x88ffbb);
        pl.position.set(p.x, 0, p.z); scene.add(pl); return pl;
      });
      // 2名防守球员
      const posDef = [{x:0.5,z:-1.2},{x:1.5,z:0.8}];
      const defenders = posDef.map(p => {
        const pl = makePlayer(0xff4466, 0xffaaaa);
        pl.position.set(p.x, 0, p.z); scene.add(pl); return pl;
      });
      // 门将
      const gkP = makePlayer(0xffcc00, 0xffee88);
      gkP.position.set(-7, 0, 0);
      scene.add(gkP);

      const ball = makeBall();
      ball.position.set(-8.5, 0.26, -5);
      scene.add(ball);

      // 角旗（黄色）
      const flagPole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.04, 1.5, 6),
        new THREE.MeshLambertMaterial({ color: 0xffcc00 })
      );
      flagPole.position.set(-8.5, 0.75, -5.3);
      scene.add(flagPole);
      const flagGeo = new THREE.PlaneGeometry(0.5, 0.3);
      const flagMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, side: THREE.DoubleSide });
      const flag = new THREE.Mesh(flagGeo, flagMat);
      flag.position.set(-8.25, 1.45, -5.3);
      scene.add(flag);

      // 头球接触光晕
      const ringGeo2 = new THREE.TorusGeometry(0.42, 0.055, 8, 20);
      const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0 });
      const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
      scene.add(ring2);

      camera.position.set(-10, 8, 10);
      camera.lookAt(-2, 1.5, -1);

      let t = 0, phase = 0;
      const CYCLE = 4.5; // 单次动画周期（秒）
      // 目标落点（内旋角球，落向前点）
      const target = { x: 0.5, z: -1.5 };
      const HEAD_HT = 3.0;

      return { label, update(dt) {
        t += dt; phase = (phase + dt) % CYCLE;
        const p = phase / CYCLE; // 0~1

        if (p < 0.25) {
          // 助跑蓄力：球静止，主罚球员原地摆腿
          ball.position.set(-8.5, 0.26, -5);
          const legSwing = 0.4 * Math.sin(t * 5);
          kicker.userData.leg0.rotation.x = legSwing;
          kicker.userData.leg1.rotation.x = -legSwing;
        } else {
          // 球飞出（0.25~0.75）：弧线传入禁区
          const fp = Math.min((p - 0.25) / 0.5, 1);
          const curve = Math.sin(fp * Math.PI);
          ball.position.x = lerp(-8.5, target.x, fp);
          ball.position.z = lerp(-5, target.z, fp);
          // 内旋弧线高度，峰值在 fp=0.45
          const peakFp = 0.45;
          ball.position.y = Math.max(0.26, HEAD_HT * (1 - ((fp - peakFp) / peakFp) * ((fp - peakFp) / peakFp)));
          ball.rotation.z += dt * 10;
          ball.rotation.x += dt * 5;

          // 进攻球员跑位+跳跃
          attackers.forEach((pl, i) => {
            const moveP = Math.min(fp * 1.5, 1);
            pl.position.x = posAtk[i].x + Math.sin(t * 0.7 + i) * 0.5;
            pl.position.z = posAtk[i].z + Math.cos(t * 0.6 + i) * 0.4;
            // 第0个攻手在 fp≈0.45 时跳跃头球
            if (i === 0) {
              const jumpP = Math.max(0, Math.sin((fp - 0.35) * Math.PI / 0.3)) * (fp > 0.35 && fp < 0.65 ? 1 : 0);
              pl.position.y = jumpP * 1.05;
              // 接触光晕
              const cd = Math.abs(fp - peakFp);
              const ci = Math.max(0, 1 - cd / 0.07);
              ring2.position.set(pl.position.x, pl.position.y + 2.10, pl.position.z);
              ring2.rotation.x = Math.PI / 2;
              ring2.rotation.z = t * 3;
              ringMat2.opacity = ci * 0.85;
              ring2.scale.setScalar(1 + ci * 0.35);
            } else {
              pl.position.y = 0;
            }
          });
          // 防守球员也跳跃
          defenders.forEach((pl, i) => {
            pl.position.x = posDef[i].x + Math.sin(t * 0.8 + i * 1.3) * 0.3;
            pl.position.z = posDef[i].z;
            pl.position.y = 0.4 * Math.max(0, Math.sin((fp - 0.4) * Math.PI / 0.3)) * (fp > 0.4 && fp < 0.7 ? 1 : 0);
          });
          // 门将移动扑救
          gkP.position.z = Math.sin(t * 1.0) * 1.2;
        }
        // 旗子飘动
        flag.rotation.y = Math.sin(t * 2) * 0.3;
        camera.position.x = -10 + Math.sin(t * 0.2) * 1.5;
        camera.lookAt(-2, 2, -1);
      }};
    },

    // ── 手球 ──
    handball: () => {
      const label = '手球 · Handball — 手臂触球违规判罚';
      // 球员（防守方）
      const player = makePlayer(0x4488ff, 0xaaccff);
      player.position.set(0, 0, 0);
      scene.add(player);

      // 射击方（进攻）
      const shooter = makePlayer(0x00cc66, 0x88ffbb);
      shooter.position.set(-4, 0, 0);
      shooter.rotation.y = Math.PI / 2;
      scene.add(shooter);

      const ball = makeBall();
      ball.position.set(-4, 0.8, 0);
      scene.add(ball);

      // ── 红色感叹号 ──（由两部分组成）
      // 竖条
      const barGeo = new THREE.BoxGeometry(0.18, 0.55, 0.12);
      const excMat = new THREE.MeshBasicMaterial({ color: 0xff2222 });
      const excBar = new THREE.Mesh(barGeo, excMat);
      // 点
      const dotGeo = new THREE.SphereGeometry(0.11, 8, 8);
      const excDot = new THREE.Mesh(dotGeo, excMat.clone());
      // 容器 group
      const excGroup = new THREE.Group();
      excBar.position.y = 0.35;
      excGroup.add(excBar);
      excDot.position.y = -0.12;
      excGroup.add(excDot);
      excGroup.visible = false;
      scene.add(excGroup);

      // 黄牌图标（扁平矩形，黄色）
      const cardGeo = new THREE.BoxGeometry(0.3, 0.42, 0.04);
      const cardMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
      const cardMesh = new THREE.Mesh(cardGeo, cardMat);
      cardMesh.visible = false;
      scene.add(cardMesh);

      // 手臂"扩大区域"高亮圆圈（红色半透明）
      const armCircGeo = new THREE.TorusGeometry(0.5, 0.06, 8, 24);
      const armCircMat = new THREE.MeshBasicMaterial({ color: 0xff3333, transparent: true, opacity: 0 });
      const armCircle = new THREE.Mesh(armCircGeo, armCircMat);
      scene.add(armCircle);

      camera.position.set(-2, 6, 10);
      camera.lookAt(0, 1.5, 0);

      let t = 0, phase = 0;
      const CYCLE = 4.0;
      // 随机：有时手臂高于肩（违规），有时正常
      let isViolation = true;
      let handY = 2.0; // 手臂触球高度 - 高于肩（1.84）为违规

      return { label, update(dt) {
        t += dt; phase = (phase + dt) % CYCLE;
        const p = phase / CYCLE; // 0~1

        // 每个周期开始时切换违规/合规
        if (p < dt * 2) {
          isViolation = !isViolation;
          handY = isViolation ? 2.15 : 1.35; // 高于肩(违规) vs 低于腰(合规)
        }

        // 球飞向防守球员手臂
        const ballFly = Math.min(p / 0.5, 1); // 前半段球飞行
        ball.position.x = lerp(-4, 0.35, ballFly);
        ball.position.y = lerp(0.8, handY, ballFly) + 0.3 * Math.sin(ballFly * Math.PI);
        ball.position.z = 0;
        ball.rotation.z += dt * 12;

        // 防守球员：手臂随违规状态展开
        const armAngle = isViolation
          ? 1.0 + 0.3 * Math.sin(t * 1.5)   // 违规：手臂高举扩大
          : 0.2 + 0.1 * Math.sin(t * 1.5);  // 合规：手臂贴身
        player.userData.arm0.rotation.z = -(armAngle);
        player.userData.arm1.rotation.z = (armAngle);
        player.userData.arm0.rotation.x = isViolation ? -0.5 : 0.1;
        player.userData.arm1.rotation.x = isViolation ? -0.5 : 0.1;

        // 球员轻微跳跃（防守动作）
        player.position.y = 0.15 * Math.abs(Math.sin(t * 1.8)) * (p > 0.2 && p < 0.7 ? 1 : 0);

        // 手臂圆圈高亮（违规时红色，合规时绿色）
        const armWorldX = 0 + (isViolation ? 0.38 : 0.25);
        const armWorldY = player.position.y + handY;
        armCircle.position.set(armWorldX, armWorldY, 0.05);
        armCircle.rotation.y = Math.PI / 2;
        armCircMat.color.setHex(isViolation ? 0xff2222 : 0x00ff88);
        armCircMat.opacity = isViolation ? 0.55 + 0.2 * Math.sin(t * 4) : 0.3;

        // 球接触手臂时（p ≈ 0.5）
        const contactP = Math.abs(p - 0.5);
        const contactIntensity = Math.max(0, 1 - contactP / 0.07);

        if (isViolation) {
          // 违规：感叹号显示，球员胸口位置
          excGroup.visible = contactIntensity > 0.05;
          excGroup.position.set(0.8, player.position.y + 2.8, 0);
          excGroup.scale.setScalar(0.8 + contactIntensity * 0.7);
          // 感叹号颜色闪烁
          const flashColor = contactIntensity > 0.3 ? 0xff2222 : 0xff6644;
          excMat.color.setHex(flashColor);
          excGroup.rotation.y = Math.sin(t * 8) * (contactIntensity * 0.15);

          // 黄牌在接触后出现
          cardMesh.visible = p > 0.55 && p < 0.88;
          cardMesh.position.set(1.5, player.position.y + 2.6, 0.2);
          cardMesh.rotation.z = Math.sin(t * 2) * 0.12;
          cardMesh.scale.setScalar(0.7 + 0.3 * Math.max(0, Math.sin((p - 0.55) * Math.PI / 0.15)));
        } else {
          // 合规：感叹号和黄牌不显示
          excGroup.visible = false;
          cardMesh.visible = false;
        }

        // 射手踢球动作
        shooter.userData.leg0.rotation.x = -0.6 * Math.sin(t * 3);
        shooter.userData.leg1.rotation.x = 0.5 * Math.sin(t * 3);

        camera.position.x = -1.5 + Math.sin(t * 0.22) * 1.5;
        camera.lookAt(0, 1.8, 0);
      }};
    },

    // ── 3-5-2 阵型 ──
    'formation-352': () => {
      const label = '3-5-2 阵型 · Formation — 三中卫+双翼卫+双前锋';
      // 球员位置：3后卫 + 5中场（2翼卫+3中场）+ 2前锋
      const positions = [
        // GK
        { x: -7.5, z: 0,    c: 0xffcc00, role: 'gk' },
        // 3 CB
        { x: -5.0, z: -2.2, c: 0xff4466, role: 'cb' },
        { x: -5.0, z:  0,   c: 0xff4466, role: 'cb' },
        { x: -5.0, z:  2.2, c: 0xff4466, role: 'cb' },
        // 2 WB (翼卫)
        { x: -1.5, z: -4.2, c: 0xff7828, role: 'wb' },
        { x: -1.5, z:  4.2, c: 0xff7828, role: 'wb' },
        // 3 CM
        { x: -1.5, z: -1.5, c: 0x00aaff, role: 'cm' },
        { x: -1.5, z:  0,   c: 0x00aaff, role: 'cm' },
        { x: -1.5, z:  1.5, c: 0x00aaff, role: 'cm' },
        // 2 FW
        { x:  3.5, z: -1.2, c: 0x00cc66, role: 'fw' },
        { x:  3.5, z:  1.2, c: 0x00cc66, role: 'fw' },
      ];
      const players = positions.map(p => {
        const pl = makePlayer(p.c, 0xffffff);
        pl.position.set(p.x, 0, p.z);
        scene.add(pl);
        return pl;
      });

      // 翼卫攻守切换路径（index 4,5 是两个翼卫）
      const wbAttackPos = [
        { x: 2.5, z: -4.5 }, // 左翼卫插上
        { x: 2.5, z:  4.5 }, // 右翼卫插上
      ];
      const wbDefPos = [
        { x: -1.5, z: -4.2 },
        { x: -1.5, z:  4.2 },
      ];

      const ball = makeBall();
      ball.position.set(0, 0.26, 0);
      scene.add(ball);

      // 阵型线（橙色，连接三中卫）
      const lineMat3 = new THREE.LineBasicMaterial({ color: 0xff7828, transparent: true, opacity: 0.5 });
      function addFormLine(pts){ scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat3)); }

      // 切换动画状态
      camera.position.set(0, 14, 11);
      camera.lookAt(0, 0, 0);

      let t = 0;
      let wbPhase = 0; // 翼卫攻守循环

      return { label, update(dt) {
        t += dt;
        wbPhase = (wbPhase + dt * 0.35) % (Math.PI * 2);

        // 全队"呼吸"感
        const breathe = 1 + 0.025 * Math.sin(t * 0.7);

        players.forEach((pl, i) => {
          const pos = positions[i];

          if (pos.role === 'wb') {
            // 翼卫：来回在攻守位置之间移动，模拟覆盖整条边路
            const wbIdx = pos.z < 0 ? 0 : 1;
            const wbT = (Math.sin(wbPhase + wbIdx * Math.PI) + 1) / 2; // 0~1
            const atk = wbAttackPos[wbIdx];
            const def = wbDefPos[wbIdx];
            pl.position.x = lerp(def.x, atk.x, wbT) * breathe;
            pl.position.z = lerp(def.z, atk.z, wbT);
            // 跑动腿部动作
            const legSwing = 0.4 * Math.sin(t * 4 + wbIdx);
            pl.userData.leg0.rotation.x = legSwing;
            pl.userData.leg1.rotation.x = -legSwing;
          } else if (pos.role === 'fw') {
            // 前锋：小幅抢点跑位
            pl.position.x = pos.x * breathe + Math.sin(t * 0.9 + i) * 0.8;
            pl.position.z = pos.z + Math.cos(t * 0.7 + i) * 0.6;
          } else {
            // 其他：呼吸晃动
            pl.position.x = pos.x * breathe;
            pl.position.z = pos.z * breathe;
          }
        });

        // 球在中场和前场之间流转（走三角传球）
        const ballCycle = (t * 0.55) % (Math.PI * 2);
        ball.position.x = -0.5 + Math.sin(ballCycle) * 3.5;
        ball.position.z = Math.cos(ballCycle * 0.8) * 3;
        ball.position.y = 0.26 + 0.08 * Math.abs(Math.sin(t * 5));
        ball.rotation.y += dt * 2.5;

        // 翼卫插上时用橙色光晕标记
        [4, 5].forEach((idx, wi) => {
          const wbT2 = (Math.sin(wbPhase + wi * Math.PI) + 1) / 2;
          if (wbT2 > 0.6) {
            players[idx].userData.leg0.rotation.z = 0.15 * wbT2;
            players[idx].userData.leg1.rotation.z = -0.15 * wbT2;
          }
        });

        camera.position.x = Math.sin(t * 0.12) * 3;
        camera.position.y = 14 - Math.sin(t * 0.08) * 1;
        camera.lookAt(0, 0, 0);
      }};
    },
  };

  // 创建场景并启动
  const sceneFn = scenes3d[id] || scenes3d['pressing'];
  const sceneCtrl = sceneFn();
  if(labelEl) labelEl.textContent = sceneCtrl.label || '';

  // 相机慢旋转基准（部分场景内部控制，这里作为后备）
  let prevTime = performance.now();

  function animate(){
    const now = performance.now();
    const dt = Math.min((now - prevTime) / 1000, 0.05);
    prevTime = now;
    sceneCtrl.update(dt);
    renderer.render(scene, camera);
    _3d.raf = requestAnimationFrame(animate);
  }

  function dispose(){
    renderer.dispose();
    scene.traverse(obj => {
      if(obj.geometry) obj.geometry.dispose();
      if(obj.material){
        if(Array.isArray(obj.material)) obj.material.forEach(m=>m.dispose());
        else obj.material.dispose();
      }
    });
    if(renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
  }

  _3d = { renderer, scene, camera, raf: null, dispose };
  animate();
}

document.getElementById('modal').addEventListener('click', e => {
  if(e.target === document.getElementById('modal')) closeModal();
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

// cat-bar 点击事件（在脚本末尾绑定，确保 DOM 和所有函数已就绪）
(function bindCatBar(){
  var bar = document.getElementById('cat-bar');
  if(!bar){ console.error('[KG] cat-bar not found'); return; }
  bar.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.cat-btn') : null;
    if(!btn){
      // 兼容不支持 closest 的环境：向上找 cat-btn
      var el = e.target;
      while(el && el !== bar){
        if(el.classList && el.classList.contains('cat-btn')){ btn = el; break; }
        el = el.parentElement;
      }
    }
    if(!btn) return;
    var cat = btn.getAttribute('data-cat');
    if(cat) switchCat(cat);
  });
  console.log('[KG] cat-bar event bound OK');
})();
